<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧招聘平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #409eff 0%, #66b1ff 50%, #409eff 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .container {
      text-align: center;
      color: #fff;
      padding: 40px;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }
    
    .logo svg {
      width: 40px;
      height: 40px;
      fill: #fff;
    }
    
    .title {
      font-size: 36px;
      font-weight: 600;
      margin-bottom: 12px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    .subtitle {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 50px;
    }
    
    .role-cards {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }
    
    .role-card {
      width: 280px;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      color: #fff;
      display: block;
    }
    
    .role-card:hover {
      transform: translateY(-8px);
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }
    
    .role-icon {
      width: 70px;
      height: 70px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .role-icon svg {
      width: 32px;
      height: 32px;
      fill: #fff;
    }
    
    .role-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .role-desc {
      font-size: 14px;
      opacity: 0.85;
      line-height: 1.6;
    }
    
    .footer {
      margin-top: 60px;
      font-size: 13px;
      opacity: 0.6;
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }
      
      .title {
        font-size: 28px;
      }
      
      .role-cards {
        flex-direction: column;
        align-items: center;
      }
      
      .role-card {
        width: 100%;
        max-width: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h1 class="title">智慧招聘平台</h1>
    <p class="subtitle">连接人才与机会，助力企业发展</p>
    
    <div class="role-cards">
      <a href="/uiapp/jobs" class="role-card">
        <div class="role-icon">
          <svg viewBox="0 0 24 24">
            <path d="M17 1.01L7 1c-1.1 0-1.99.9-1.99 2v18c0 1.1.89 2 1.99 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
          </svg>
        </div>
        <h3 class="role-title">求职者端</h3>
        <p class="role-desc">浏览岗位、投递简历、管理求职进度</p>
      </a>
      
      <a href="/web/login" class="role-card">
        <div class="role-icon">
          <svg viewBox="0 0 24 24">
            <path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/>
          </svg>
        </div>
        <h3 class="role-title">企业管理后台</h3>
        <p class="role-desc">HR岗位管理、简历筛选、面试安排</p>
        <p class="role-desc" style="margin-top: 5px; font-size: 12px;">平台管理员登录入口</p>
      </a>
    </div>
    
    <div class="footer">
      <p>© 2024 智慧招聘平台 版权所有</p>
    </div>
  </div>
</body>
</html>
